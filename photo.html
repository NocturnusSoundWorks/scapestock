<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Photo | ScapeStock</title>

<style>

body{
font-family:sans-serif;
margin:0;
background:#f5f5f5;
text-align:center;
}

.container{
max-width:900px;
margin:auto;
padding:40px 20px;
}

img{
max-width:100%;
border-radius:8px;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

.download{
margin-top:20px;
}

.download a{
display:inline-block;
padding:12px 24px;
background:#333;
color:white;
text-decoration:none;
border-radius:6px;
font-weight:bold;
}

.back{
margin-top:30px;
}

.back a{
color:#333;
text-decoration:underline;
}

</style>

</head>

<body>

<div class="container">

<img id="photo" src="">
<h3 id="title"></h3>
<div class="download">
<a id="downloadBtn" href="#" download>Download</a>
</div>

<div class="back">
<a href="index.html">← Back to ScapeStock</a>
</div>

</div>

<script>

/* URLからID取得 */

const params=new URLSearchParams(window.location.search)
const id=params.get("id")

/* 画像パス作成 */

const image="images/full/"+id+".jpg"

/* 表示 */

document.getElementById("photo").src=image
document.getElementById("downloadBtn").href=image

/* タイトル */

document.getElementById("title").textContent="Photo "+id

</script>

</body>

</html>
