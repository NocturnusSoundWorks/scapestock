<!DOCTYPE html>

<html lang="en">

<head>
<meta charset="UTF-8">

<title>Nature Free Stock Photos | ScapeStock</title>

<meta name="description" content="Nature free stock photos from Japan. Download high quality nature images for free.">

<style>

body{
font-family:sans-serif;
margin:0;
background:#f7f7f7;
}

/* HERO HEADER */

.hero{
height:300px;
background-image:url("../images/hero.jpg");
background-size:cover;
background-position:center;

display:flex;
align-items:center;
justify-content:center;

color:#000;
text-align:center;
}

.hero-inner{
background:rgba(255,255,255,0.75);
padding:40px;
border-radius:10px;
}

.hero h1{
font-size:42px;
margin-bottom:10px;
}

.hero p{
margin-bottom:0;
font-size:18px;
}

/* MAIN LAYOUT */

.container{
display:grid;
grid-template-columns:220px 1fr 200px;
gap:30px;
max-width:1400px;
margin:auto;
padding:20px;
}

/* SIDEBAR */

.sidebar{
background:white;
padding:20px;
border-radius:8px;
height:fit-content;
}

.sidebar h2{
margin-top:0;
}

.sidebar a{
display:block;
padding:6px 0;
text-decoration:none;
color:#333;
}

.sidebar a:hover{
text-decoration:underline;
}

/* GALLERY */

.gallery{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
gap:16px;
width:100%;
align-items:start;
}

.gallery a{
display:block;
}

.gallery img{
width:100%;
aspect-ratio:1/1;
object-fit:cover;
border-radius:8px;
display:block;

background:#fff;
padding:4px;
box-shadow:0 3px 8px rgba(0,0,0,0.08);

transition:transform 0.25s ease, box-shadow 0.25s ease;
}

.gallery img:hover{
transform:scale(1.04);
box-shadow:0 12px 25px rgba(0,0,0,0.2);
}

/* MOBILE */

@media screen and (max-width:1000px){

.container{
grid-template-columns:1fr;
}

.sidebar{
order:2;
}

.gallery{
grid-template-columns:repeat(2,1fr);
}

}

</style>

</head>

<body>

<!-- HERO -->

<div class="hero">

<div class="hero-inner">

<h1>Nature Photos</h1>

<p>Free nature stock photos from Japan</p>

</div>

</div>

<!-- MAIN -->

<div class="container">

<!-- SIDEBAR -->

<div class="sidebar">

<h2>Categories</h2>

<a href="../cities/tokyo.html">Tokyo</a>

<h2>Tags</h2>

<a href="japan.html">Japan</a> <a href="traditional.html">traditional</a> <a href="sakura.html">sakura</a> <a href="nature.html">nature</a> <a href="night.html">night</a> <a href="rain.html">rain</a> <a href="flower.html">flower</a> <a href="sky.html">sky</a> <a href="city.html">city</a> <a href="texture.html">texture</a> <a href="scenery.html">scenery</a>

</div>

<!-- MAIN GALLERY -->

<div>

<div class="gallery" id="gallery"></div>

<div id="pagination" style="text-align:center;margin-top:20px;"></div>

<p style="margin-top:40px;text-align:center;">

<a href="../index.html" style="color:#333;text-decoration:underline;">
Back to Home
</a>

</p>

</div>

<!-- RIGHT EMPTY -->

<div></div>

</div>

<script>

const TAG="nature"
const IMAGES_PER_PAGE=36

let currentPage=1
let filteredImages=[]

document.addEventListener("DOMContentLoaded",async()=>{

await loadGallery()
filterTag()
shuffleImages()
showPage(1)

})

async function loadGallery(){

const res=await fetch("../gallery.html")
const html=await res.text()

document.getElementById("gallery").innerHTML=html

fixImagePath()

}

function fixImagePath(){

document.querySelectorAll("#gallery img").forEach(img=>{

const src=img.getAttribute("src")

if(!src.startsWith("../")){
img.src="../"+src
}

})

}

function filterTag(){

const images=Array.from(document.querySelectorAll("#gallery a"))

filteredImages=images.filter(a=>{

const alt=a.querySelector("img").alt.toLowerCase()

return alt.includes(TAG)

})

}

function shuffleImages(){

filteredImages.sort(()=>Math.random()-0.5)

}

function showPage(page){

const totalImages=filteredImages.length
const totalPages=Math.ceil(totalImages/IMAGES_PER_PAGE)

currentPage=page

document.querySelectorAll("#gallery a").forEach(a=>{
a.style.display="none"
})

const start=(page-1)*IMAGES_PER_PAGE
const end=start+IMAGES_PER_PAGE

filteredImages.slice(start,end).forEach(a=>{
a.style.display=""
})

renderPagination(totalPages)

}

function renderPagination(totalPages){

const pagination=document.getElementById("pagination")
pagination.innerHTML=""

for(let i=1;i<=totalPages;i++){

const btn=document.createElement("button")

btn.textContent=i
btn.onclick=()=>showPage(i)

btn.style.margin="4px"
btn.style.padding="8px 12px"
btn.style.background=i===currentPage?"#333":"#ccc"
btn.style.color=i===currentPage?"#fff":"#000"
btn.style.border="none"
btn.style.borderRadius="4px"
btn.style.cursor="pointer"

pagination.appendChild(btn)

}

}

</script>

</body>
</html>
