<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>flower Free Stock Photos | ScapeStock</title>

<meta name="description" content="flower free stock photos. Download high quality images from ScapeStock.">

<style>

body{
font-family:sans-serif;
background:#f7f7f7;
margin:0;
padding:20px;
display:flex;
flex-direction:column;
align-items:center;
text-align:center;
}

h1{
margin-top:10px;
margin-bottom:10px;
}

p{
color:#555;
}

.backlink{
margin-bottom:20px;
}

.gallery{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
gap:16px;
width:100%;
align-items:start;
}

.gallery img{
width:100%;
height:200px;
object-fit:cover;
border-radius:8px;
max-width:220px;
display:block;
transition:transform 0.25s ease, box-shadow 0.25s ease;
}

.gallery img:hover{
transform:scale(1.05);
box-shadow:0 10px 20px rgba(0,0,0,0.2);
cursor:pointer;
}

/* モーダル */

.modal{
display:none;
position:fixed;
z-index:10;
padding-top:60px;
left:0;
top:0;
width:100%;
height:100%;
overflow:auto;
background-color:rgba(0,0,0,0.8);
justify-content:center;
align-items:center;
}

.modal-content{
margin:auto;
display:block;
max-width:70%;
max-height:70%;
box-shadow:0 0 20px #000;
border-radius:8px;
background:#fff;
}

@media screen and (max-width:900px){

.gallery{
grid-template-columns:repeat(2,1fr);
}

}

</style>

</head>

<body>

<div class="backlink">
<a href="../index.html">← Back to Home</a>
</div>

<h1>flower Free Stock Photos</h1>

<p>flower photos from Japan.</p>

<div class="gallery" id="gallery"></div>

<!-- モーダル -->

<div id="modal" class="modal" onclick="closeModal(event)">

<div style="text-align:center;">

<img id="modalImg" class="modal-content" src="" alt="">

<p style="color:white;margin-top:1em;">
Do you want to download this image?
</p>

<a
id="downloadBtn"
href="#"
download
style="display:inline-block;padding:10px 20px;background:#fff;color:#333;border-radius:6px;text-decoration:none;font-weight:bold;"
>
Download
</a>

</div>

</div>

<script>

async function loadGallery(){

 const res = await fetch("../gallery.html");
 const html = await res.text();

 const gallery = document.getElementById("gallery");
 gallery.innerHTML = html;

 fixImagePath();
 filterTag();
 setModalEvents();

}

function fixImagePath(){

 const images = document.querySelectorAll("#gallery img");

 images.forEach(img => {

   const src = img.getAttribute("src");

   if(!src.startsWith("../")){
     img.src = "../" + src;
   }

 });

}

function filterTag(){

 const images = document.querySelectorAll("#gallery img");

 images.forEach(img => {

   if(!img.alt.includes("flower")){
     img.style.display="none";
   }

 });

}

function setModalEvents(){

document.querySelectorAll('#gallery img').forEach(img=>{

img.onclick=function(){

const modal=document.getElementById('modal')
const modalImg=document.getElementById('modalImg')
const downloadBtn=document.getElementById('downloadBtn')

modal.style.display="flex"

modalImg.src=this.src
modalImg.alt=this.alt

const thumbSrc=this.src
const fullSrc=thumbSrc.replace("thu/","full/").replace("_thu","")

downloadBtn.href=fullSrc
downloadBtn.download=fullSrc.split('/').pop()

}

})

}

function closeModal(e){

if(e.target.id==='modalImg'||e.target.id==='downloadBtn') return

document.getElementById('modal').style.display="none"

}

window.onload = loadGallery;

</script>

</body>
</html>
