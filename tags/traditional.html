<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Traditional Japan Free Stock Photos | ScapeStock</title>

<meta name="description" content="Free traditional Japan stock photos including shrines, temples and cultural scenes.">

<style>

body{
font-family:sans-serif;
background:#f7f7f7;
margin:0;
padding:20px;
display:flex;
flex-direction:column;
align-items:center;
text-align:center;
}

h1{
margin-top:10px;
margin-bottom:10px;
}

p{
color:#555;
}

.backlink{
margin-bottom:20px;
}

.gallery{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:16px;
max-width:1000px;
margin:auto;
}

.gallery img{
width:100%;
height:200px;
object-fit:cover;
border-radius:6px;
}

@media screen and (max-width:900px){

.gallery{
grid-template-columns:repeat(2,1fr);
}

}

</style>

</head>

<body>

<div class="backlink">
<a href="../index.html">← Back to Home</a>
</div>

<h1>Traditional Japan Photos</h1>

<p>Free traditional Japan photos including shrines, temples and cultural scenes.</p>

<div class="gallery" id="gallery"></div>

<script>

async function loadGallery(){

 const res = await fetch("../gallery.html");
 const html = await res.text();

 const gallery = document.getElementById("gallery");
 gallery.innerHTML = html;

 fixImagePath();
 filterTraditional();
}

function fixImagePath(){

 const images = document.querySelectorAll("#gallery img");

 images.forEach(img => {

   const src = img.getAttribute("src");

   if(!src.startsWith("../")){
     img.src = "../" + src;
   }

 });

}

function filterTraditional(){

 const images = document.querySelectorAll("#gallery img");

 images.forEach(img => {

   if(!img.alt.includes("traditional")){
     img.style.display="none";
   }

 });

}

window.onload = loadGallery;

</script>

</body>
</html>
