<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScapeStock</title>
  <style>
     body {
    font-family: sans-serif;
    margin: 0;
    background: #f7f7f7;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
    h1 {
      text-align: center;
    }
    
    .gallery {
    display: grid;
    grid-template-columns: repeat(4, 1fr); /* 4枚並び */
    gap: 16px;
    max-width: 1000px;
    margin-top: 30px;
    justify-items: center;
  }

  .gallery img {
    width: 100%;
    height: 200px;
    object-fit: cover;
    border-radius: 8px;
    max-width: 220px; /* 正方形を維持しつつ幅制限 */
  }

  @media screen and (max-width: 960px) {
    .gallery {
      grid-template-columns: repeat(2, 1fr); /* 小さい画面では2列 */
    }
  }

    /* モーダル全体の背景 */
.modal {
  display: none;
  position: fixed;
  z-index: 10;
  padding-top: 60px;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  overflow: auto;
  background-color: rgba(0,0,0,0.8);
  justify-content: center;
  align-items: center;
}

/* 拡大画像 */
.modal-content {
  margin: auto;
  display: block;
  max-width: 70%;
  max-height: 70%;
  box-shadow: 0 0 20px #000;
  border-radius: 8px;
  transition: 0.3s;
  background: #fff;
}
  </style>
</head>
<body>
  <h1>ScapeStock</h1>
  <p style="text-align:center;">風景と都市スナップのフリー写真素材</p><br>
  
  <div style="margin: 20px 0; text-align: center;">
  <form onsubmit="filterImages(); return false;">
    <input
      type="text"
      id="searchInput"
      placeholder="画像を検索..."
      style="padding: 8px; width: 60%; max-width: 500px; font-size: 16px;"
    />
    <button
      type="submit"
      style="padding: 8px 16px; font-size: 16px; margin-left: 8px; background: #333; color: white; border: none; border-radius: 4px; cursor: pointer;"
    >
      検索
    </button>
  </form>
</div>
 <div class="gallery" id="gallery"></div>
  <!-- ページボタン表示エリア -->
<div id="pagination" style="text-align: center; margin-top: 20px;"></div>
  <p style="text-align: center; margin-top: 40px;">
  <a href="terms.html" style="color: #333; text-decoration: underline;">利用規約はこちら</a>
</p>
  
<div id="modal" class="modal" onclick="closeModal(event)">
  <div style="text-align: center;">
    <img id="modalImg" class="modal-content" src="" alt="拡大画像">
    <p style="color: white; margin-top: 1em;">この画像をダウンロードしますか？</p>
    <a id="downloadBtn" href="#" download style="
      display: inline-block;
      padding: 10px 20px;
      background: #ffffff;
      color: #333;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
    ">
      ダウンロード
    </a>
  </div>
</div>

<script>
  const IMAGES_PER_PAGE = 20;
  let currentPage = 1;
  let shuffledImages = []; // グローバルで保持

  document.addEventListener("DOMContentLoaded", async () => {
    await loadGallery();   // 1) まず外部HTMLを読み込む
    shuffleImages();       // 2) 読み込んだ画像をランダム化
    showPage(1);           // 3) ページ1を表示
    setModalEvents();      // 4) モーダル設定
  });

  // ★ 追加：gallery.html を読み込んで挿入
  async function loadGallery() {
    try {
      const res = await fetch("gallery.html"); // 必要なら cache busting: "gallery.html?ver=1"
      if (!res.ok) throw new Error(res.status + " " + res.statusText);
      const html = await res.text();
      document.getElementById("gallery").innerHTML = html;
    } catch (e) {
      console.error("ギャラリー読み込み失敗:", e);
      document.getElementById("gallery").innerHTML = "<p>ギャラリーを読み込めませんでした。</p>";
    }
  }

  function shuffleImages() {
    const images = Array.from(document.querySelectorAll('#gallery img'));
    shuffledImages = images.sort(() => Math.random() - 0.5);
  }

  function showPage(page) {
    const totalImages = shuffledImages.length;
    const totalPages = Math.ceil(totalImages / IMAGES_PER_PAGE);
    currentPage = page;

    // すべて非表示に
    document.querySelectorAll('#gallery img').forEach(img => {
      img.style.display = 'none';
    });

    const start = (page - 1) * IMAGES_PER_PAGE;
    const end = start + IMAGES_PER_PAGE;

    // ランダム順にしたリストから表示
    shuffledImages.slice(start, end).forEach(img => {
      img.style.display = '';
    });

    renderPagination(totalPages);
  }

  function renderPagination(totalPages) {
    const pagination = document.getElementById('pagination');
    pagination.innerHTML = '';

    if (currentPage > 1) {
      const prevBtn = document.createElement('button');
      prevBtn.textContent = '←';
      prevBtn.onclick = () => { showPage(currentPage - 1); setModalEvents(); };
      styleButton(prevBtn, false);
      pagination.appendChild(prevBtn);
    }

    const maxButtons = 5;
    let startPage = Math.max(1, currentPage - Math.floor(maxButtons / 2));
    let endPage = startPage + maxButtons - 1;

    if (endPage > totalPages) {
      endPage = totalPages;
      startPage = Math.max(1, endPage - maxButtons + 1);
    }

    for (let i = startPage; i <= endPage; i++) {
      const btn = document.createElement('button');
      btn.textContent = i;
      btn.onclick = () => { showPage(i); setModalEvents(); };
      styleButton(btn, i === currentPage);
      pagination.appendChild(btn);
    }

    if (currentPage < totalPages) {
      const nextBtn = document.createElement('button');
      nextBtn.textContent = '→';
      nextBtn.onclick = () => { showPage(currentPage + 1); setModalEvents(); };
      styleButton(nextBtn, false);
      pagination.appendChild(nextBtn);
    }
  }

  function styleButton(btn, isActive) {
    btn.style.margin = '4px';
    btn.style.padding = '8px 12px';
    btn.style.background = isActive ? '#333' : '#ccc';
    btn.style.color = isActive ? '#fff' : '#000';
    btn.style.border = 'none';
    btn.style.borderRadius = '4px';
    btn.style.cursor = 'pointer';
  }

  function setModalEvents() {
    document.querySelectorAll('#gallery img').forEach(img => {
      img.onclick = function () {
        const modal = document.getElementById('modal');
        const modalImg = document.getElementById('modalImg');
        const downloadBtn = document.getElementById('downloadBtn');

        modal.style.display = "flex";
        modalImg.src = this.src;
        modalImg.alt = this.alt;

        const thumbSrc = this.src;
        const fullSrc = thumbSrc.replace("thu/", "full/").replace("_thu", "");
        downloadBtn.href = fullSrc;
        downloadBtn.download = fullSrc.split('/').pop();
      };
    });
  }

  function closeModal(e) {
    if (e.target.id === 'modalImg' || e.target.id === 'downloadBtn') return;
    document.getElementById('modal').style.display = "none";
  }

  function filterImages() {
    const input = document.getElementById('searchInput').value.toLowerCase();
    const images = document.querySelectorAll('#gallery img');
    let results = [];

    images.forEach(img => {
      const alt = img.alt.toLowerCase();
      if (alt.includes(input)) results.push(img);
    });

    const pagination = document.getElementById('pagination');
    pagination.innerHTML = '';

    images.forEach(img => { img.style.display = 'none'; });
    results.forEach(img => { img.style.display = ''; });

    setModalEvents();

    if (input.trim() === '') {
      showPage(1);
    }
  }
</script>
</body>
</html>
