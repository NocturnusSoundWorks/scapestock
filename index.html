<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ScapeStock | Free Landscape and City Stock Photos</title>

<meta name="description" content="Free landscape and urban stock photos. Download high quality Japan travel, city and nature images for free.">

<style>

body{
font-family:sans-serif;
margin:0;
background:#f7f7f7;
}

/* HEADER */

.header{
background:white;
padding:30px 20px;
text-align:center;
border-bottom:1px solid #ddd;
}

.header h1{
margin:0 0 10px 0;
}

.header p{
margin:0 0 20px 0;
}

/* 検索 */

.search-box{
display:flex;
justify-content:center;
}

.search-box form{
display:flex;
width:100%;
max-width:600px;
}

.search-box input{
flex:1;
padding:10px;
font-size:16px;
border:1px solid #ccc;
border-radius:6px 0 0 6px;
}

.search-box button{
padding:10px 20px;
font-size:16px;
background:#333;
color:white;
border:none;
border-radius:0 6px 6px 0;
cursor:pointer;
}

/* メインレイアウト */

.container{
display:grid;
grid-template-columns:220px 1fr 200px;
gap:30px;
max-width:1400px;
margin:auto;
padding:20px;
}

/* 左サイドバー */

.sidebar{
background:white;
padding:20px;
border-radius:8px;
height:fit-content;
}

.sidebar h2{
margin-top:0;
}

.sidebar a{
display:block;
padding:6px 0;
text-decoration:none;
color:#333;
}

.sidebar a:hover{
text-decoration:underline;
}

/* ギャラリー */

.gallery{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
gap:16px;
width:100%;
align-items:start;
}

.gallery a{
display:block;
}

.gallery img{
width:100%;
aspect-ratio:1/1;
object-fit:cover;
border-radius:8px;
display:block;

background:#fff;
padding:4px;
box-shadow:0 3px 8px rgba(0,0,0,0.08);

transition:transform 0.25s ease, box-shadow 0.25s ease;
}

.gallery img:hover{
transform:scale(1.04);
box-shadow:0 12px 25px rgba(0,0,0,0.2);
cursor:pointer;
}



/* スマホ */

@media screen and (max-width:1000px){

.container{
grid-template-columns:1fr;
}

.sidebar{
order:2;
}

.gallery{
grid-template-columns:repeat(2,1fr);
}

}
/* HERO HEADER */

.hero{
height:420px;
background-image:url("images/hero.jpg");
background-size:cover;
background-position:center;

display:flex;
align-items:center;
justify-content:center;

color:#000;
text-align:center;
}

.hero-inner{
background:rgba(255,255,255,0.75);
padding:40px;
border-radius:10px;
}

.hero h1{
font-size:48px;
margin-bottom:10px;
}

.hero p{
margin-bottom:20px;
font-size:18px;
}
</style>
</head>

<body>

<!-- HERO HEADER -->

<div class="hero">

<div class="hero-inner">

<h1>ScapeStock</h1>

<p>Free stock photos of Japan landscapes and cities</p>

<div class="search-box">

<form onsubmit="filterImages(); return false;">

<input
type="text"
id="searchInput"
placeholder="Search photos (sakura, city, sky...)"
>

<button type="submit">
Search
</button>

</form>

</div>

</div>

</div>

<!-- MAIN -->

<div class="container">

<!-- 左 -->

<div class="sidebar">

<h2>Categories</h2>

<a href="cities/tokyo.html">Tokyo</a><br>
<br>
<br>

<h2>Tags</h2>

<a href="tags/japan.html">Japan</a>
<a href="tags/traditional.html">traditional</a>
<a href="tags/sakura.html">sakura</a>  
<a href="tags/nature.html">nature</a>
<a href="tags/night.html">night</a>
<a href="tags/rain.html">rain</a>
<a href="tags/flower.html">flower</a>
<a href="tags/sky.html">sky</a>
<a href="tags/city.html">city</a>
<a href="tags/texture.html">texture</a>
<a href="tags/scenery.html">scenery</a>

</div>

<!-- 中央 -->

<div>

<div class="gallery" id="gallery"></div>

<div id="pagination" style="text-align:center;margin-top:20px;"></div>

<p style="margin-top:40px;text-align:center;">

<a href="terms-en.html" style="color:#333;text-decoration:underline;">
Terms of Use
</a>

</p>

</div>

<!-- 右（将来用） -->

<div></div>

</div>



<script>

/* 既存JSそのまま */

const IMAGES_PER_PAGE=36
let currentPage=1
let shuffledImages=[]

document.addEventListener("DOMContentLoaded",async()=>{

await loadGallery()
shuffleImages()
showPage(1)

})

async function loadGallery(){

const res=await fetch("gallery.html")
const html=await res.text()
document.getElementById("gallery").innerHTML=html

}

function shuffleImages(){

const images=Array.from(document.querySelectorAll('#gallery a'))
shuffledImages=images.sort(()=>Math.random()-0.5)

}

function showPage(page){

const totalImages=shuffledImages.length
const totalPages=Math.ceil(totalImages/IMAGES_PER_PAGE)

currentPage=page

document.querySelectorAll('#gallery a').forEach(a=>{
a.style.display='none'
})

const start=(page-1)*IMAGES_PER_PAGE
const end=start+IMAGES_PER_PAGE

shuffledImages.slice(start,end).forEach(a=>{
a.style.display=''
})

renderPagination(totalPages)

}

function renderPagination(totalPages){

const pagination=document.getElementById('pagination')
pagination.innerHTML=''

for(let i=1;i<=totalPages;i++){

const btn=document.createElement('button')

btn.textContent=i
btn.onclick=()=>{showPage(i);}

btn.style.margin='4px'
btn.style.padding='8px 12px'
btn.style.background=i===currentPage?'#333':'#ccc'
btn.style.color=i===currentPage?'#fff':'#000'
btn.style.border='none'
btn.style.borderRadius='4px'
btn.style.cursor='pointer'

pagination.appendChild(btn)

}

}



function filterImages(){

const input=document.getElementById('searchInput').value.toLowerCase()

const images=document.querySelectorAll('#gallery a')

let results=[]

images.forEach(img=>{

const alt=img.querySelector("img").alt.toLowerCase()

if(alt.includes(input)) results.push(img)

})

const pagination=document.getElementById('pagination')
pagination.innerHTML=''

images.forEach(img=>{img.style.display='none'})
results.forEach(img=>{img.style.display=''})



if(input.trim()===''){
showPage(1)
}

}

</script>

</body>
</html>
