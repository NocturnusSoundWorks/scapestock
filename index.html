<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ScapeStock | Free Landscape and City Stock Photos</title>

<meta name="description" content="Free landscape and urban stock photos. Download high quality Japan travel, city and nature images for free.">

<style>

body{
font-family:sans-serif;
margin:0;
background:#f7f7f7;
}

/* HEADER */

.header{
background:white;
padding:30px 20px;
text-align:center;
border-bottom:1px solid #ddd;
}

.header h1{
margin:0 0 10px 0;
}

.header p{
margin:0 0 20px 0;
}

/* 検索 */

.search-box{
display:flex;
justify-content:center;
}

.search-box form{
display:flex;
width:100%;
max-width:600px;
}

.search-box input{
flex:1;
padding:10px;
font-size:16px;
border:1px solid #ccc;
border-radius:6px 0 0 6px;
}

.search-box button{
padding:10px 20px;
font-size:16px;
background:#333;
color:white;
border:none;
border-radius:0 6px 6px 0;
cursor:pointer;
}

/* メインレイアウト */

.container{
display:grid;
grid-template-columns:220px 1fr 200px;
gap:30px;
max-width:1400px;
margin:auto;
padding:20px;
}

/* 左サイドバー */

.sidebar{
background:white;
padding:20px;
border-radius:8px;
height:fit-content;
}

.sidebar h2{
margin-top:0;
}

.sidebar a{
display:block;
padding:6px 0;
text-decoration:none;
color:#333;
}

.sidebar a:hover{
text-decoration:underline;
}

/* ギャラリー */

.gallery{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:16px;
max-width:1000px;
margin:auto;
justify-items:center;
}

.gallery img{
width:100%;
height:200px;
object-fit:cover;
border-radius:8px;
max-width:220px;
}

/* モーダル */

.modal{
display:none;
position:fixed;
z-index:10;
padding-top:60px;
left:0;
top:0;
width:100%;
height:100%;
overflow:auto;
background-color:rgba(0,0,0,0.8);
justify-content:center;
align-items:center;
}

.modal-content{
margin:auto;
display:block;
max-width:70%;
max-height:70%;
box-shadow:0 0 20px #000;
border-radius:8px;
background:#fff;
}

/* スマホ */

@media screen and (max-width:1000px){

.container{
grid-template-columns:1fr;
}

.sidebar{
order:2;
}

.gallery{
grid-template-columns:repeat(2,1fr);
}

}

</style>
</head>

<body>

<!-- HEADER -->

<div class="header">

<h1>ScapeStock</h1>

<p>Free stock photos of landscapes and urban snapshots</p>

<div class="search-box">

<form onsubmit="filterImages(); return false;">

<input
type="text"
id="searchInput"
placeholder="Search images..."
>

<button type="submit">
Search
</button>

</form>

</div>

</div>

<!-- MAIN -->

<div class="container">

<!-- 左 -->

<div class="sidebar">

<h2>Categories</h2>

<a href="cities/tokyo.html">Tokyo</a>

<h2>Tags</h2>

<a href="tags/japan.html">Japan</a>
<a href="tags/traditional.html">Traditional</a>
<a href="tags/rain.html">Rain</a>
<a href="tags/flower.html">Flower</a>

</div>

<!-- 中央 -->

<div>

<div class="gallery" id="gallery"></div>

<div id="pagination" style="text-align:center;margin-top:20px;"></div>

<p style="margin-top:40px;text-align:center;">

<a href="terms-en.html" style="color:#333;text-decoration:underline;">
Terms of Use
</a>

</p>

</div>

<!-- 右（将来用） -->

<div></div>

</div>


<!-- モーダル -->

<div id="modal" class="modal" onclick="closeModal(event)">

<div style="text-align:center;">

<img id="modalImg" class="modal-content" src="" alt="">

<p style="color:white;margin-top:1em;">
Do you want to download this image?
</p>

<a
id="downloadBtn"
href="#"
download
style="display:inline-block;padding:10px 20px;background:#fff;color:#333;border-radius:6px;text-decoration:none;font-weight:bold;"
>

Download

</a>

</div>

</div>

<script>

/* 既存JSそのまま */

const IMAGES_PER_PAGE=20
let currentPage=1
let shuffledImages=[]

document.addEventListener("DOMContentLoaded",async()=>{

await loadGallery()
shuffleImages()
showPage(1)
setModalEvents()

})

async function loadGallery(){

const res=await fetch("gallery.html")
const html=await res.text()
document.getElementById("gallery").innerHTML=html

}

function shuffleImages(){

const images=Array.from(document.querySelectorAll('#gallery img'))
shuffledImages=images.sort(()=>Math.random()-0.5)

}

function showPage(page){

const totalImages=shuffledImages.length
const totalPages=Math.ceil(totalImages/IMAGES_PER_PAGE)

currentPage=page

document.querySelectorAll('#gallery img').forEach(img=>{
img.style.display='none'
})

const start=(page-1)*IMAGES_PER_PAGE
const end=start+IMAGES_PER_PAGE

shuffledImages.slice(start,end).forEach(img=>{
img.style.display=''
})

renderPagination(totalPages)

}

function renderPagination(totalPages){

const pagination=document.getElementById('pagination')
pagination.innerHTML=''

for(let i=1;i<=totalPages;i++){

const btn=document.createElement('button')

btn.textContent=i
btn.onclick=()=>{showPage(i);setModalEvents();}

btn.style.margin='4px'
btn.style.padding='8px 12px'
btn.style.background=i===currentPage?'#333':'#ccc'
btn.style.color=i===currentPage?'#fff':'#000'
btn.style.border='none'
btn.style.borderRadius='4px'
btn.style.cursor='pointer'

pagination.appendChild(btn)

}

}

function setModalEvents(){

document.querySelectorAll('#gallery img').forEach(img=>{

img.onclick=function(){

const modal=document.getElementById('modal')
const modalImg=document.getElementById('modalImg')
const downloadBtn=document.getElementById('downloadBtn')

modal.style.display="flex"

modalImg.src=this.src
modalImg.alt=this.alt

const thumbSrc=this.src
const fullSrc=thumbSrc.replace("thu/","full/").replace("_thu","")

downloadBtn.href=fullSrc
downloadBtn.download=fullSrc.split('/').pop()

}

})

}

function closeModal(e){

if(e.target.id==='modalImg'||e.target.id==='downloadBtn') return

document.getElementById('modal').style.display="none"

}

function filterImages(){

const input=document.getElementById('searchInput').value.toLowerCase()

const images=document.querySelectorAll('#gallery img')

let results=[]

images.forEach(img=>{

const alt=img.alt.toLowerCase()

if(alt.includes(input)) results.push(img)

})

const pagination=document.getElementById('pagination')
pagination.innerHTML=''

images.forEach(img=>{img.style.display='none'})
results.forEach(img=>{img.style.display=''})

setModalEvents()

if(input.trim()===''){
showPage(1)
}

}

</script>

</body>
</html>
