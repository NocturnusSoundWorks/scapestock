<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tokyo Free Stock Photos | ScapeStock</title>

<meta name="description" content="Free Tokyo street and city stock photos. Download high quality Tokyo travel images.">

<style>

body{
font-family:sans-serif;
background:#f7f7f7;
margin:0;
padding:20px;
display:flex;
flex-direction:column;
align-items:center;
text-align:center;
}

/* タイトル */

h1{
margin-top:10px;
margin-bottom:10px;
}

p{
color:#555;
}

/* 戻るリンク */

.backlink{
margin-bottom:20px;
}

/* タグ */

.tags{
margin-top:20px;
margin-bottom:30px;
}

.tags a{
display:inline-block;
margin:4px;
padding:6px 12px;
background:#eee;
border-radius:20px;
text-decoration:none;
color:#333;
font-size:14px;
}

.tags a:hover{
background:#333;
color:white;
}

/* ギャラリー */

.gallery{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:16px;
max-width:1000px;
margin:auto;
}

.gallery img{
width:100%;
height:200px;
object-fit:cover;
border-radius:6px;
}

/* スマホ */

@media screen and (max-width:900px){

.gallery{
grid-template-columns:repeat(2,1fr);
}

}

</style>

</head>

<body>

<div class="backlink">
<a href="../index.html">← Back to Home</a>
</div>

<h1>Tokyo Free Stock Photos</h1>

<p>Free Tokyo street and city landscape photos.</p>

<div class="tags">

<a href="../tags/japan.html">Japan</a>
<a href="../tags/night.html">Night</a>
<a href="../tags/street.html">Street</a>
<a href="../tags/city.html">City</a>

</div>

<div class="gallery" id="gallery"></div>

<script>

async function loadGallery() {

 const res = await fetch("../gallery.html");
 const html = await res.text();

 const gallery = document.getElementById("gallery");
 gallery.innerHTML = html;

 const images = gallery.querySelectorAll("img");

 images.forEach(img => {

   const src = img.getAttribute("src");

   if(!src.startsWith("../")){
     img.src = "../" + src;
   }

 });

 filterTokyo();
}

function filterTokyo(){

 const images = document.querySelectorAll("#gallery img");

 images.forEach(img => {

   if(!img.alt.includes("tokyo") && !img.alt.includes("東京")){
      img.style.display="none";
   }

 });

}

window.onload = loadGallery;

</script>

</body>
</html>
